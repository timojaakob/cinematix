<script>
// --- Theme switch. The theme itself was already applied pre-paint by the
// inline script in <head>; this just syncs the switch to match and
// persists explicit choices for every page to pick up. The 'cc-theme-changed'
// event is a no-op unless a page listens for it (movie.html's calendar
// repaints its availability colors on it). ---
const THEME_KEY = 'cinemacity-theme';
const themeInput = document.getElementById('theme-switch-input');
const themeLabel = document.getElementById('theme-switch-label');

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  themeInput.checked = theme === 'light';
  themeLabel.textContent = theme === 'light' ? 'Light mode' : 'Dark mode';
  document.dispatchEvent(new CustomEvent('cc-theme-changed'));
}

applyTheme(document.documentElement.dataset.theme || 'dark');

themeInput.addEventListener('change', () => {
  const theme = themeInput.checked ? 'light' : 'dark';
  localStorage.setItem(THEME_KEY, theme);
  applyTheme(theme);
});

// --- Global settings modal ---
const globalSettingsBtn = document.getElementById('global-settings-btn');
const globalSettingsOverlay = document.getElementById('global-settings-overlay');
const globalSettingsCloseBtn = document.getElementById('global-settings-close-btn');

globalSettingsBtn.addEventListener('click', () => globalSettingsOverlay.classList.add('open'));
globalSettingsCloseBtn.addEventListener('click', () => globalSettingsOverlay.classList.remove('open'));
globalSettingsOverlay.addEventListener('click', (e) => {
  if (e.target === globalSettingsOverlay) globalSettingsOverlay.classList.remove('open');
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && globalSettingsOverlay.classList.contains('open')) globalSettingsOverlay.classList.remove('open');
});

// --- TMDb API key show/hide toggle (hidden by default). ---
const tmdbKeyInput = document.getElementById('tmdb_api_key');
const tmdbKeyToggle = document.getElementById('tmdb-key-toggle');
const tmdbKeyEyeSlash = document.getElementById('tmdb-key-eye-slash');

tmdbKeyToggle.addEventListener('click', () => {
  const showing = tmdbKeyInput.type === 'text';
  tmdbKeyInput.type = showing ? 'password' : 'text';
  tmdbKeyEyeSlash.style.display = showing ? 'none' : '';
  tmdbKeyToggle.setAttribute('aria-pressed', String(!showing));
  tmdbKeyToggle.setAttribute('aria-label', showing ? 'Show API key' : 'Hide API key');
});

// --- Global settings form: Save stays disabled until something changes,
// same dirty-tracking pattern as the per-movie settings dialog. ---
const globalSettingsForm = document.getElementById('global-settings-form');
const globalSettingsApplyBtn = document.getElementById('global-settings-apply-btn');
const globalSettingsFields = Array.from(globalSettingsForm.elements).filter(el => el.name && el.type !== 'hidden');
const globalSettingsInitial = new Map(
  globalSettingsFields.map(el => [el, el.type === 'checkbox' ? el.checked : el.value])
);

function updateGlobalSettingsApplyState() {
  const dirty = globalSettingsFields.some(el => {
    const current = el.type === 'checkbox' ? el.checked : el.value;
    return current !== globalSettingsInitial.get(el);
  });
  globalSettingsApplyBtn.disabled = !dirty;
}

for (const el of globalSettingsFields) {
  el.addEventListener('input', updateGlobalSettingsApplyState);
  el.addEventListener('change', updateGlobalSettingsApplyState);
}

// --- ntfy test button: probes whatever's currently typed in the field,
// unsaved edits included, rather than the last-saved config.json value. ---
const ntfyEndpointInput = document.getElementById('ntfy_endpoint');
const ntfyTestBtn = document.getElementById('ntfy-test-btn');
const ntfyTestStatus = document.getElementById('ntfy-test-status');

ntfyTestBtn.addEventListener('click', async () => {
  const endpoint = ntfyEndpointInput.value.trim();
  ntfyTestStatus.className = 'setting-hint';
  if (!endpoint) {
    ntfyTestStatus.textContent = 'Enter an ntfy endpoint first.';
    ntfyTestStatus.classList.add('error');
    ntfyTestStatus.style.display = '';
    return;
  }
  const ntfyBtnDefaultText = ntfyTestBtn.textContent;
  ntfyTestBtn.disabled = true;
  ntfyTestBtn.textContent = 'Sending…';
  ntfyTestStatus.style.display = 'none';
  try {
    const resp = await fetch('{{ url_for("test_notification") }}', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ntfy_endpoint: endpoint }),
    });
    const data = await resp.json();
    ntfyTestStatus.textContent = data.ok ? 'Test notification sent.' : (data.error || 'Could not send test notification.');
    ntfyTestStatus.classList.add(data.ok ? 'success' : 'error');
  } catch (e) {
    ntfyTestStatus.textContent = 'Could not reach the server.';
    ntfyTestStatus.classList.add('error');
  }
  ntfyTestStatus.style.display = '';
  ntfyTestBtn.disabled = false;
  ntfyTestBtn.textContent = ntfyBtnDefaultText;
});
</script>
