{# Shared <head> contents for every page, including the offline loading
   shell (shell.html), so the shell looks exactly like the real pages. #}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="cinematix">
<link rel="icon" type="image/png" href="{{ asset('favicon.png') }}">
<link rel="apple-touch-icon" href="{{ asset('logo.png') }}">
<link rel="manifest" href="{{ asset('manifest.json') }}">
<link rel="preload" href="{{ asset('elms-sans-latin.woff2') }}" as="font" type="font/woff2" crossorigin>
<script>
// Resolve the theme before first paint so there's no flash of the wrong
// mode: an explicit choice from the settings switch wins, otherwise fall
// back to the OS-level preference.
(function () {
  var stored = localStorage.getItem('cinemacity-theme');
  var theme = (stored === 'light' || stored === 'dark')
    ? stored
    : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.documentElement.dataset.theme = theme;
  document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#eef1f5' : '#0e1116';
})();
</script>
<style>
  /* Self-hosted (not a Google Fonts link) so the app keeps working fully
     offline/LAN-only. Variable 400-800; latin-ext covers Czech titles. */
  @font-face {
    font-family: 'Elms Sans'; font-style: normal; font-weight: 400 800; font-display: swap;
    src: url('{{ asset("elms-sans-latin.woff2") }}') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Elms Sans'; font-style: normal; font-weight: 400 800; font-display: swap;
    src: url('{{ asset("elms-sans-latin-ext.woff2") }}') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
</style>
